<title>Simulador G</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: herramienta de una pantalla. Teléfono: visor 3D arriba, transporte, panel de código abajo. Escritorio: visor a la izquierda, panel a la derecha. */
:root{
  --durazno:#CF825A; --tostado:#B46034; --gris:#7C7470;
  --bg:#FFFFFF; --fg:#000000; --muted:#5E5752; --surface:#F7F4F2; --line:#E6E0DC;
  --view:#FBF9F8; --acc-text:#B46034; --sel:rgba(207,130,90,.16); --warn:#A8321F;
  --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --fg:#FFFFFF; --muted:#B3ACA8; --surface:#121010; --line:#2A2624;
  --view:#080707; --acc-text:#CF825A; --sel:rgba(207,130,90,.22); --warn:#F08A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#FFFFFF; --muted:#B3ACA8; --surface:#121010; --line:#2A2624;
  --view:#080707; --acc-text:#CF825A; --sel:rgba(207,130,90,.22); --warn:#F08A70; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden;padding-inline:16px;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--durazno);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding-block:10px}
.ave{display:flex;width:30px;flex:none}
.ave svg{width:30px;height:auto;display:block}
.ave-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ave-l{display:none}:root:not([data-theme="light"]) .ave-d{display:flex}}
:root[data-theme="dark"] .ave-l{display:none}:root[data-theme="dark"] .ave-d{display:flex}
.name{display:flex;flex-direction:column;min-width:0;flex:1}
.name b{white-space:nowrap;font-weight:600;font-size:17px;letter-spacing:.01em;line-height:1.1}
.name span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--gris)}
.btn.pri{background:var(--tostado);border-color:var(--tostado);color:#FFFFFF}
.pick{position:relative;overflow:hidden;display:inline-block}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:40px}
.pick:focus-within{outline:2px solid var(--durazno);outline-offset:2px}
.top .btn{padding:7px 10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));margin:0 auto;max-width:440px;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13.5px;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--warn);color:#FFFFFF}
.toast a{color:inherit;font-weight:600;text-underline-offset:3px;display:inline-block;margin-top:4px}

.app{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,42%);gap:10px;padding-bottom:12px}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:minmax(0,1fr) auto}
  .viewer{grid-column:1;grid-row:1}.transport{grid-column:1;grid-row:2}.panel{grid-column:2;grid-row:1/3}
}

.viewer{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--view);min-height:0}
#cv{display:block;width:100%;height:100%;touch-action:none}
.dro{position:absolute;left:8px;top:8px;font:12px/1.35 var(--mono);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 9px;pointer-events:none;display:grid;grid-template-columns:auto auto;column-gap:8px}
.dro .k{color:var(--muted)}
.dro .v{text-align:right;min-width:9ch}
.dro .ax{font-weight:500;color:var(--fg)}
.dro hr{grid-column:1/3;border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.views{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.views button{font:500 10.5px var(--mono);letter-spacing:.04em;width:42px;height:32px;border-radius:7px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent)}
.views button.on{border-color:var(--durazno);color:var(--acc-text)}
.views button.unit{margin-top:6px;background:var(--tostado);border-color:var(--tostado);color:#FFFFFF}
.tools td{vertical-align:middle}
.tools .desc{font-size:11px;color:var(--muted);white-space:normal;max-width:22ch}
.tin{width:100%;min-width:64px;padding:6px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-family:var(--mono);font-size:13px;color:var(--fg)}
.tin[data-own]{border-color:var(--durazno)}
.stk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stk label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.stk input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-family:var(--mono);font-size:13px;color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--tostado);color:#FFFFFF}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:12px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--bg) 82%,transparent);border-radius:6px;padding:3px 8px;pointer-events:none}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend .c i{border-color:var(--durazno)}.legend .r i{border-color:var(--gris)}

.transport{display:flex;align-items:center;gap:8px}
.tb{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.tb svg{width:18px;height:18px;fill:currentColor}
.tb.play{background:var(--tostado);border-color:var(--tostado);color:#FFFFFF;width:48px}
@media (max-width:420px){.transport{gap:6px}.tb{width:36px}.tb.play{width:44px}.speed{padding:0 4px}}
.scrub{flex:1 1 0;min-width:72px;display:flex;flex-direction:column;gap:2px}
.scrub input{width:100%;accent-color:var(--durazno)}
.times{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.speed{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font:500 13px var(--mono)}

.panel{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;font-weight:500;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--durazno)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font:500 11px/18px var(--mono);background:var(--warn);color:#FFFFFF;margin-left:4px}
.pane{flex:1;min-height:0;overflow:auto}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.bar .hint{flex:1;color:var(--muted);font-size:12px;min-width:0}
.code{font:12.5px/1.6 var(--mono);padding-block:4px}
.ln{display:flex;gap:10px;padding:0 10px;white-space:pre;cursor:pointer}
.ln .n{color:var(--muted);opacity:.7;min-width:4ch;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.ln .t{min-width:0}
.ln.cur{background:var(--sel)}
.ln.cur .n{color:var(--acc-text);opacity:1}
.ln.w .n{color:var(--warn);opacity:1}
.ln .g{color:var(--acc-text);font-weight:500}
.ln .m{color:var(--fg);font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ln .cm{color:var(--muted);font-style:italic}
#ed{display:block;width:100%;height:100%;min-height:240px;border:0;resize:none;padding:10px;font:12.5px/1.6 var(--mono);background:var(--bg);white-space:pre;overflow:auto}
#ed:focus-visible{outline:none}
.edwrap{display:flex;flex-direction:column;height:100%}
.edwrap textarea{flex:1}

.info{padding:12px 14px;display:flex;flex-direction:column;gap:16px}
.info h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font:500 18px var(--mono);font-variant-numeric:tabular-nums}
.stat.big{grid-column:1/3}
.stat.big .v{font-size:24px;color:var(--fg)}
.stat.big .v small{font-size:12px;color:var(--muted);margin-left:6px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.tbl td.mono{font-family:var(--mono)}
.tblw{overflow-x:auto}
.set{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set input{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-family:var(--mono)}
.note{color:var(--muted);font-size:12px;margin:0;max-width:60ch}
.warns{list-style:none;margin:0;padding:6px 0}
.warns li{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.warns button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font:500 11px var(--mono);padding:2px 7px;flex:none;color:var(--warn)}
.warns .ok{color:var(--muted);padding:16px 14px}
.foot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;padding:6px 14px 12px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

<main class="app">
  <section class="viewer" aria-label="Vista 3D de la trayectoria">
    <canvas id="cv"></canvas>
    <div class="dro" aria-live="off">
      <span class="k ax">X</span><span class="v" id="dx">0.000</span>
      <span class="k ax">Y</span><span class="v" id="dy">0.000</span>
      <span class="k ax">Z</span><span class="v" id="dz">0.000</span>
      <hr>
      <span class="k">N</span><span class="v" id="dn">–</span>
      <span class="k">T</span><span class="v" id="dt">–</span>
      <span class="k">S</span><span class="v" id="ds">0</span>
      <span class="k">F</span><span class="v" id="df">0</span>
    </div>
    <div class="views" role="group" aria-label="Vistas">
      <button type="button" data-v="iso" class="on">ISO</button>
      <button type="button" data-v="xy">XY</button>
      <button type="button" data-v="xz">XZ</button>
      <button type="button" data-v="yz">YZ</button>
      <button type="button" data-v="fit" aria-label="Ajustar a la pieza">FIT</button>
      <button type="button" id="bPath" class="on">RUTA</button>
      <button type="button" id="bStock" aria-pressed="false" aria-label="Mostrar material y desbaste">MAT</button>
      <button type="button" id="bUnit" class="unit">MM</button>
    </div>
    <div class="legend"><span class="c"><i></i>Corte</span><span class="r"><i></i>Rápido</span></div>
  </section>

  <section class="transport" aria-label="Reproducción">
    <button class="tb" id="bStart" type="button" aria-label="Ir al inicio"><svg viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM19 5v14L9 12z"/></svg></button>
    <button class="tb" id="bBack" type="button" aria-label="Bloque anterior"><svg viewBox="0 0 24 24"><path d="M18 5v14l-9-7zM5 5h2.5v14H5z"/></svg></button>
    <button class="tb play" id="bPlay" type="button" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="iPlay"><path d="M7 4v16l13-8z"/></svg></button>
    <button class="tb" id="bStep" type="button" aria-label="Bloque siguiente"><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7zM16.5 5H19v14h-2.5z"/></svg></button>
    <div class="scrub">
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Posición en el programa">
      <div class="times"><span id="tNow">0:00</span><span id="tTot">0:00</span></div>
    </div>
    <select class="speed" id="speed" aria-label="Velocidad">
      <option value="1">1×</option><option value="2">2×</option><option value="5">5×</option>

<script>
// Autor: BS
"use strict";
const $ = s => document.querySelector(s);
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const SAMPLE = `%

N560 T3 M06

/* ============ Intérprete de código G (fresadora / centro de maquinado) ============ */
function parse(src, rapidRate, defInch){
  const lines = src.split(/\r?\n/);
  const W = [], seen = new Set();
  const warn = (li, msg, key) => { if (key){ if (seen.has(key)) return; seen.add(key); } if (W.length < 400) W.push({li, msg}); };
  const noCom = src.replace(/\([^)]*\)/g, ' ').replace(/;.*$/gm, ' ');
  const um = noCom.match(/G\s*0*2([01])(?![\d.])/i);
  /* Sin G20/G21 el control usa sus unidades por parámetro: se toman de Montaje (defInch). */
  const unitsGuessed = !um;
  const inch = um ? um[1] === '0' : !!defInch;
  const k0 = inch ? 25.4 : 1;
  let maxZ = -Infinity;
  for (const m of noCom.matchAll(/Z\s*([+-]?(?:\d+\.?\d*|\.\d+))/gi)) maxZ = Math.max(maxZ, parseFloat(m[1]));
  if (!isFinite(maxZ)) maxZ = 0;
  const homeZ = Math.max(maxZ * k0, 0) + 50;
  let mixed = false;

  const tools = {}, used = [], wcsUsed = new Set();
  const st = {x:0, y:0, z:homeZ, abs:true, plane:17, g1:0, cm:0, F:0, S:0, sp:5, tool:0, next:0, ret:98, perRev:false,
              cyc:{R:null, Z:null, Q:null, P:0}, cycZ:homeZ, k:k0};
  const pos = [], typ = [], lin = [], dur = [], fA = [], sA = [], tA = [];
  const lineSeg = new Int32Array(lines.length + 1);
  let endLine = -1;

  let stockC = null;
  function toolComment(c){
    const sm = c.match(/STOCK\b(.*)/i);
    if (sm && !stockC){
      const g = L => { const m = sm[1].match(new RegExp(L + '\\s*([+-]?(?:\\d+\\.?\\d*|\\.\\d+))\\s*[/:,]\\s*([+-]?(?:\\d+\\.?\\d*|\\.\\d+))', 'i')); return m ? [parseFloat(m[1]) * k0, parseFloat(m[2]) * k0].sort((a, b) => a - b) : null; };
      const X = g('X'), Y = g('Y'), Z = g('Z');
      const one = L => { const m = sm[1].match(new RegExp('(?:^|\\s)' + L + '\\s*=?\\s*([+-]?(?:\\d+\\.?\\d*|\\.\\d+))(?!\\s*[/:,\\d])', 'i')); return m ? parseFloat(m[1]) * k0 : null; };
      const D = one('(?:D|DIA|Ø)');
      if (D && Z) stockC = {shape: 'round', dia: D, ccx: one('X') ?? 0, ccy: one('Y') ?? 0, z0: Z[0], z1: Z[1]};
      else if (X && Y && Z) stockC = {shape: 'rect', x0: X[0], x1: X[1], y0: Y[0], y1: Y[1], z0: Z[0], z1: Z[1]};
      return;
    }
    const t = c.match(/\bT\s*0*(\d+)\b/i); if (!t) return;
    const n = +t[1]; if (tools[n]) return;
    const d = c.match(/(?:^|[\s,(])(?:D|DIA|Ø|⌀)\s*[=:]?\s*(\d*\.?\d+)/i);
    tools[n] = {d: d ? parseFloat(d[1]) * k0 : null, desc: c.trim()};
  }
  function seg(x, y, z, type, li, chk = true){
    const len = Math.hypot(x - st.x, y - st.y, z - st.z);
    if (len < 1e-9){ st.x = x; st.y = y; st.z = z; return; }
    let r = type === 0 ? rapidRate : (st.perRev ? st.F * st.S : st.F);
    if (type === 1 && !(r > 0)){ warn(li, 'Avance F no definido: se usa F100 para estimar el tiempo', 'F0'); r = 100; }
    if (type === 1 && st.sp === 5) warn(li, 'Corte con el husillo detenido (falta M03/M04)', 'sp' + li);
    if (type === 0 && chk && (z < -1e-6 || (st.z < -1e-6 && Math.hypot(x - st.x, y - st.y) > 1e-6))) warn(li, 'Movimiento rápido por debajo de Z0: revisa posible choque', 'rz' + li);
    pos.push(st.x, st.y, st.z, x, y, z); typ.push(type); lin.push(li);
    dur.push(Math.max(len / r * 60, 1e-4)); fA.push(type ? (st.perRev ? st.F * st.S : st.F) : 0); sA.push(st.sp === 5 ? 0 : st.S); tA.push(st.tool);
    st.x = x; st.y = y; st.z = z;
  }
  function dwell(sec, li){
    pos.push(st.x, st.y, st.z, st.x, st.y, st.z); typ.push(2); lin.push(li);
    dur.push(Math.max(sec, 1e-4)); fA.push(0); sA.push(st.sp === 5 ? 0 : st.S); tA.push(st.tool);
  }
  const secsP = (v, raw) => raw.includes('.') ? v : v / 1000;

  function arc(cw, e, w, li){
    const s = [st.x, st.y, st.z];
    let A, B, C, oa, ob;
    if (st.plane === 17){ A = 0; B = 1; C = 2; oa = w.I || 0; ob = w.J || 0; }
    else if (st.plane === 18){ A = 2; B = 0; C = 1; oa = w.K || 0; ob = w.I || 0; }
    else { A = 1; B = 2; C = 0; oa = w.J || 0; ob = w.K || 0; }
    const sa = s[A], sb = s[B], ea = e[A], eb = e[B];
    let ca, cb;
    if ('R' in w){
      const r = w.R, dx = ea - sa, dy = eb - sb, d = Math.hypot(dx, dy);
      if (d < 1e-9){ warn(li, 'Arco con R y mismo punto inicial y final: usa I/J/K para círculo completo'); return; }
      const h2 = r * r - d * d / 4;
      if (h2 < -1e-6 * Math.max(1, r * r)) warn(li, `Radio R${+(Math.abs(r) / st.k).toFixed(4)} demasiado pequeño para la distancia entre puntos (${+(d / st.k).toFixed(4)})`);
      const h = Math.sqrt(Math.max(0, h2)), nx = -dy / d, ny = dx / d;
      let side = cw ? -1 : 1; if (r < 0) side = -side;
      ca = (sa + ea) / 2 + side * h * nx; cb = (sb + eb) / 2 + side * h * ny;
    } else {
      if (!('I' in w || 'J' in w || 'K' in w)){ warn(li, 'Arco sin R ni I/J/K: se ignora'); return; }
      ca = sa + oa; cb = sb + ob;
    }
    const r0 = Math.hypot(sa - ca, sb - cb), r1 = Math.hypot(ea - ca, eb - cb);
    const tol = 0.01 + 0.002 * r0;
    if (Math.abs(r0 - r1) > tol) warn(li, `Arco inválido: radio inicial ${+(r0 / st.k).toFixed(4)} ≠ final ${+(r1 / st.k).toFixed(4)}`);
    const a0 = Math.atan2(sb - cb, sa - ca), a1 = Math.atan2(eb - cb, ea - ca);
    let sw = cw ? a0 - a1 : a1 - a0;
    while (sw <= 1e-7) sw += Math.PI * 2;
    while (sw > Math.PI * 2 + 1e-7) sw -= Math.PI * 2;
    const n = Math.max(4, Math.ceil(sw / (Math.PI * 2) * 96));
    const dir = cw ? -1 : 1;
    for (let i = 1; i <= n; i++){
      const t = i / n, ang = a0 + dir * sw * t, r = r0 + (r1 - r0) * t, p = [0, 0, 0];
      p[A] = ca + r * Math.cos(ang); p[B] = cb + r * Math.sin(ang); p[C] = s[C] + (e[C] - s[C]) * t;
      if (i === n){ p[A] = ea; p[B] = eb; }
      seg(p[0], p[1], p[2], 1, li);
    }
  }

  function cycle(w, raws, li){
    const c = st.cyc;
    if (c.R == null || c.Z == null){ warn(li, 'Ciclo fijo sin R o sin Z definidos'); return; }
    const reps = Math.max(1, Math.round(w.L ?? w.K ?? 1));
    const m = st.cm, d = 0.5;
    for (let k = 0; k < reps; k++){
      const tx = 'X' in w ? (st.abs ? w.X : st.x + w.X) : st.x;
      const ty = 'Y' in w ? (st.abs ? w.Y : st.y + w.Y) : st.y;
      const init = st.cycZ;
      const rL = st.abs ? c.R : init + c.R;
      const zL = st.abs ? c.Z : rL + c.Z;
      if (zL > rL) warn(li, 'El fondo Z del ciclo está por encima del plano R', 'cz' + li);
      seg(tx, ty, st.z, 0, li);
      seg(tx, ty, rL, 0, li, false);
      if (m === 83 || m === 73){
        const q = Math.abs(c.Q || 0);
        if (!(q > 0)){ warn(li, 'Ciclo de picoteo sin Q: se simula en una sola pasada', 'q' + li); seg(tx, ty, zL, 1, li); }
        else {
          let depth = rL, g = 0;
          while (depth > zL + 1e-9 && g++ < 5000){
            const nx = Math.max(zL, depth - q);
            if (m === 83 && depth < rL) seg(tx, ty, depth + d, 0, li, false);
            seg(tx, ty, nx, 1, li);
            if (nx > zL + 1e-9) seg(tx, ty, m === 83 ? rL : nx + d, 0, li, false);
            depth = nx;
          }
        }
      } else {
        seg(tx, ty, zL, 1, li);
        if (c.P && (m === 82 || m === 89 || m === 88 || m === 86)) dwell(c.P, li);
      }
      if (m === 84 || m === 74 || m === 85 || m === 89) seg(tx, ty, rL, 1, li); else seg(tx, ty, rL, 0, li, false);
      if (st.ret === 98 && init > rL) seg(tx, ty, init, 0, li, false);
    }
  }

  const IGN = new Set([5.1, 8, 9, 40, 43, 44, 43.4, 49, 61, 61.1, 64, 90.1, 91.1, 187, 15.0]);
  const CYC = new Set([73, 74, 76, 81, 82, 83, 84, 85, 86, 87, 88, 89]);
  const re = /([A-Za-z])\s*([+-]?(?:\d+\.?\d*|\.\d+))/g;

  for (let li = 0; li < lines.length; li++){
    lineSeg[li] = typ.length;
    if (endLine >= 0) continue;
    let code = lines[li].replace(/\(([^)]*)\)/g, (_, c) => { toolComment(c); return ' '; });
    const sc = code.indexOf(';'); if (sc >= 0){ toolComment(code.slice(sc + 1)); code = code.slice(0, sc); }
    code = code.trim();
    if (!code || code[0] === '%') continue;
    if (code[0] === '/') code = code.slice(1);
    if (code[0] === ':') continue;
    const rest = code.replace(re, '').replace(/\s+/g, '');
    if (rest) warn(li, 'Texto no reconocido: ' + rest.slice(0, 24));
    const w = {}, raws = {}, G = [], M = [];
    let m; re.lastIndex = 0;
    while ((m = re.exec(code))){
      const L = m[1].toUpperCase(), v = parseFloat(m[2]);
      if (L === 'G') G.push(Math.round(v * 10) / 10); else if (L === 'M') M.push(Math.round(v)); else { w[L] = v; raws[L] = m[2]; }
    }
    if ('O' in w && !G.length && !M.length) continue;
    for (const g of G) if (g === 20 || g === 21){ const k = g === 20 ? 25.4 : 1; if (k !== st.k) mixed = true; st.k = k; }
    for (const L of 'XYZIJKRQF') if (L in w) w[L] *= st.k;
    if ('A' in w || 'B' in w || 'C' in w) warn(li, 'Ejes rotativos A/B/C: no se simulan', 'rot');

    let dw = false, home = false, g53 = false, noMove = false, cycNew = false;
    for (const g of G){
      if (g === 0 || g === 1 || g === 2 || g === 3){ st.g1 = g; st.cm = 0; }
      else if (g === 4) dw = true;
      else if (g === 17 || g === 18 || g === 19) st.plane = g;
      else if (g === 20 || g === 21) {}
      else if (g === 28) home = true;
      else if (g === 53) g53 = true;
      else if (g === 10 || g === 92 || g === 52){ noMove = true; warn(li, `G${g} cambia el origen; la simulación no lo aplica`, 'g' + g); }
      else if ((g >= 54 && g <= 59) || g === 54.1){ const n = 'G' + g; if (wcsUsed.size && !wcsUsed.has(n)) warn(li, `Se usan varios orígenes (${[...wcsUsed, n].join(', ')}); todos se dibujan sobre el mismo cero`, 'wcs'); wcsUsed.add(n); }
      else if (g === 80) st.cm = 0;
      else if (CYC.has(g)){ if (!st.cm) st.cycZ = st.z; st.cm = g; cycNew = true; if (g === 76 || g === 87) warn(li, `G${g}: se simula como barrenado simple`, 'g' + g); }
      else if (g === 90) st.abs = true;
      else if (g === 91) st.abs = false;
      else if (g === 98 || g === 99) st.ret = g;
      else if (g === 94) st.perRev = false;
      else if (g === 95) st.perRev = true;
      else if (g === 41 || g === 42) warn(li, 'Compensación G41/G42: se dibuja la trayectoria programada, sin compensar el radio', 'comp');
      else if ([50, 51, 68, 69, 16, 93].includes(g)) warn(li, `G${g} (escala, rotación, polares o tiempo inverso) no se simula`, 'g' + g);
      else if (!IGN.has(g)) warn(li, `G${g} no reconocido; se ignora`);
    }
    if ('F' in w) st.F = w.F;
    if ('S' in w) st.S = w.S;
    if ('T' in w) st.next = Math.round(w.T);

    for (const mm of M){
      if (mm === 3 || mm === 4) st.sp = mm;
      else if (mm === 8 || mm === 7) {}
      else if (mm === 6){
        if (st.z < homeZ) seg(st.x, st.y, homeZ, 0, li, false);
        st.tool = st.next; if (!used.includes(st.tool)) used.push(st.tool);
        if (st.sp !== 5) warn(li, 'Cambio de herramienta con el husillo girando', 'm6sp' + li);
        st.sp = 5;
      }
      else if (mm === 98) warn(li, 'Subprogramas M98: no se expanden', 'm98');
    }

    const has = k => k in w;
    const tg = (k, cur) => has(k) ? (st.abs ? w[k] : cur + w[k]) : cur;
    if (dw){
      const sec = has('X') ? parseFloat(raws.X) : has('P') ? secsP(w.P, raws.P) : has('U') ? w.U : 0;
      dwell(sec, li);
    } else if (noMove){
    } else if (home){
      seg(tg('X', st.x), tg('Y', st.y), tg('Z', st.z), 0, li, false);
      seg(has('X') ? 0 : st.x, has('Y') ? 0 : st.y, has('Z') ? homeZ : st.z, 0, li, false);
    } else if (g53){
      if (has('Z')) seg(st.x, st.y, homeZ, 0, li, false);
      if (has('X') || has('Y')) warn(li, 'G53 en X/Y: posición de máquina desconocida, no se simula', 'g53');
    } else if (st.cm){
      const c = st.cyc;
      if (has('R')) c.R = w.R;
      if (has('Z')) c.Z = w.Z;
      if (has('Q')) c.Q = w.Q;
      if (has('P')) c.P = secsP(w.P, raws.P);
      if (has('X') || has('Y') || cycNew) cycle(w, raws, li);
    } else if (st.g1 === 0 || st.g1 === 1){
      if (has('X') || has('Y') || has('Z')) seg(tg('X', st.x), tg('Y', st.y), tg('Z', st.z), st.g1, li);
    } else {
      if (has('X') || has('Y') || has('Z') || has('I') || has('J') || has('K'))
        arc(st.g1 === 2, [tg('X', st.x), tg('Y', st.y), tg('Z', st.z)], w, li);
    }

    for (const mm of M){
      if (mm === 5) st.sp = 5;
      else if (mm === 30 || mm === 2) endLine = li;
    }
  }
  lineSeg[lines.length] = typ.length;
  if (endLine < 0 && typ.length) warn(lines.length - 1, 'El programa no termina con M30 o M02', 'end');

  const n = typ.length, cum = new Float64Array(n);
  let acc = 0, tCut = 0, tRap = 0, tDw = 0, dCut = 0, dRap = 0;
  const toolTime = {};
  const bb = {min:[Infinity, Infinity, Infinity], max:[-Infinity, -Infinity, -Infinity]};
  const cb = {min:[Infinity, Infinity, Infinity], max:[-Infinity, -Infinity, -Infinity]};
  for (let i = 0; i < n; i++){
    acc += dur[i]; cum[i] = acc;
    const L = Math.hypot(pos[i*6+3] - pos[i*6], pos[i*6+4] - pos[i*6+1], pos[i*6+5] - pos[i*6+2]);
    if (typ[i] === 0){ tRap += dur[i]; dRap += L; } else if (typ[i] === 1){ tCut += dur[i]; dCut += L; } else tDw += dur[i];
    toolTime[tA[i]] = (toolTime[tA[i]] || 0) + dur[i];
    for (let k = 0; k < 2; k++) for (let a = 0; a < 3; a++){
      const v = pos[i*6 + k*3 + a];
      bb.min[a] = Math.min(bb.min[a], v); bb.max[a] = Math.max(bb.max[a], v);
      if (typ[i] === 1){ cb.min[a] = Math.min(cb.min[a], v); cb.max[a] = Math.max(cb.max[a], v); }
    }
  }
  if (unitsGuessed && n){
    const ext = Math.max(cb.max[0] - cb.min[0], cb.max[1] - cb.min[1]);
    let hint = '';
    if (!inch && ext < 30) hint = ` La pieza mide ${ext.toFixed(1)} mm: si en realidad son pulgadas, cámbialo.`;
    if (inch && ext > 1500) hint = ` La pieza mide ${(ext / 25.4).toFixed(1)} in: si en realidad son milímetros, cámbialo.`;
    W.push({li: 0, msg: `El programa no dice G20 ni G21: se leyó en ${inch ? 'pulgadas' : 'milímetros'}, como está en Montaje.${hint}`});
  }
  W.sort((a, b) => a.li - b.li);
  return {unitsGuessed,lines, n, pos:new Float32Array(pos), typ:Uint8Array.from(typ), lin:Int32Array.from(lin), dur, cum,
    f:fA, s:sA, t:tA, W, tools, used, lineSeg, homeZ, inch, mixed, bb, cb, rapidRate, stockC,
    stats:{total:acc, tCut, tRap, tDw, dCut, dRap}, toolTime};
}

/* ============ Visor 3D ============ */
const cv = $('#cv'), viewerEl = $('.viewer');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1e6);
camera.up.set(0, 0, 1);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));
const dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(1, -2, 3); scene.add(dl);

let dispInch = false;
const UN = () => dispInch ? 'in' : 'mm';
const len = v => isFinite(v) ? (dispInch ? v / 25.4 : v).toFixed(dispInch ? 4 : 3) : '–';
const feed = v => dispInch ? (v / 25.4).toFixed(1) : String(Math.round(v));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C_FEED = new THREE.Color('#CF825A'), C_RAPID = new THREE.Color('#7C7470');

let R = null, ghost = null, traced = null, partial = null, grid = null, axes = null, size = 100;
const toolG = new THREE.Group();
const cutter = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 28), new THREE.MeshStandardMaterial({color:0xB8B0AB, metalness:.6, roughness:.35}));
cutter.rotation.x = Math.PI / 2; cutter.position.z = .5;
const holder = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 28), new THREE.MeshStandardMaterial({color:0x4A4542, metalness:.4, roughness:.5}));
holder.rotation.x = Math.PI / 2;
const cutG = new THREE.Group(); cutG.add(cutter);
const holdG = new THREE.Group(); holdG.add(holder);
toolG.add(cutG, holdG); scene.add(toolG);

function applyTheme(){
  scene.background = new THREE.Color(css('--view') || '#FBF9F8');
  if (ghost) ghost.material.opacity = STK.mesh ? .1 : css('--bg').toUpperCase() === '#000000' ? .32 : .26;
  if (STK.mesh){ STK.dirty = true; updateStockMesh(); }
  if (R) buildGrid();
  requestRender();
}

const ctl = {az:-Math.PI * .3, el:.55, r:200, tgt:new THREE.Vector3()};
function applyCam(){
  const ce = Math.cos(ctl.el);
  camera.position.set(ctl.tgt.x + ctl.r * ce * Math.cos(ctl.az), ctl.tgt.y + ctl.r * ce * Math.sin(ctl.az), ctl.tgt.z + ctl.r * Math.sin(ctl.el));
  camera.near = ctl.r / 500; camera.far = ctl.r * 50; camera.updateProjectionMatrix();
  camera.lookAt(ctl.tgt);
}
function fit(){
  if (!R || !R.n){ ctl.tgt.set(0, 0, 0); ctl.r = 200; applyCam(); return; }
  const b = R.cb.min[0] <= R.cb.max[0] ? R.cb : R.bb, c = [0, 1, 2].map(a => (b.min[a] + b.max[a]) / 2);
  ctl.tgt.set(c[0], c[1], c[2]);
  const ext = Math.max(b.max[0] - b.min[0], b.max[1] - b.min[1], b.max[2] - b.min[2], 1e-3);
  const asp = Math.max(.6, Math.min(camera.aspect, 1));
  ctl.r = ext * .58 / Math.tan(camera.fov * Math.PI / 360) / asp + ext * .1;
  applyCam(); requestRender();
}
function setView(v){
  document.querySelectorAll('.views button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'iso'){ ctl.az = -Math.PI * .3; ctl.el = .55; }
  else if (v === 'xy'){ ctl.az = -Math.PI / 2; ctl.el = Math.PI / 2 - 1e-3; }
  else if (v === 'xz'){ ctl.az = -Math.PI / 2; ctl.el = 0; }
  else if (v === 'yz'){ ctl.az = 0; ctl.el = 0; }
  fit();
}

function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; }
function buildGrid(){
  if (grid){ scene.remove(grid); grid.geometry.dispose(); }
  if (axes){ scene.remove(axes); axes.geometry.dispose(); }
  const b = R.bb;
  const ext = Math.max(b.max[0] - b.min[0], b.max[1] - b.min[1], 10);
  const step = dispInch ? niceStep(ext / 25.4 / 8) * 25.4 : niceStep(ext / 8);
  const half = Math.ceil(Math.max(Math.abs(b.min[0]), Math.abs(b.max[0]), Math.abs(b.min[1]), Math.abs(b.max[1])) * 1.15 / step) * step;
  const dark = css('--bg').toUpperCase() === '#000000';
  grid = new THREE.GridHelper(half * 2, Math.round(half * 2 / step), dark ? 0x3A3431 : 0xD9D1CC, dark ? 0x1E1B1A : 0xEEE8E4);
  grid.rotation.x = Math.PI / 2;
  grid.position.z = STK.mesh ? STK.z0 - .01 : 0;
  scene.add(grid);
  axes = new THREE.AxesHelper(step * 2); scene.add(axes);
}

/* Trayectoria: 0 = cortes y rápidos, 1 = solo cortes, 2 = oculta. Los rápidos se ocultan
   con una copia de posiciones donde cada rápido queda de largo cero. */
let pathMode = +(LS.get('simg.path') || 0) % 3, paAll = null, paCut = null;
const PATH_LBL = ['RUTA', 'CORTE', 'SIN'], PATH_TXT = ['Trayectoria: cortes y rápidos', 'Trayectoria: solo cortes', 'Trayectoria oculta'];
function applyPath(){
  const b = $('#bPath');
  b.textContent = PATH_LBL[pathMode]; b.classList.toggle('on', pathMode !== 2);
  b.setAttribute('aria-label', PATH_TXT[pathMode] + '. Toca para cambiar');
  $('.legend').hidden = pathMode === 2;
  $('.legend .r').hidden = pathMode === 1;
  if (!ghost) return;
  const a = pathMode === 1 ? paCut : paAll;
  ghost.geometry.setAttribute('position', a); traced.geometry.setAttribute('position', a);
  ghost.visible = traced.visible = pathMode !== 2;
  requestRender();
}
function buildScene(){
  for (const o of [ghost, traced, partial]) if (o){ scene.remove(o); o.geometry.dispose(); o.material.dispose(); }
  const n = R.n, col = new Float32Array(n * 6);
  for (let i = 0; i < n; i++){ const c = R.typ[i] === 0 ? C_RAPID : C_FEED; col.set([c.r, c.g, c.b, c.r, c.g, c.b], i * 6); }
  const pa = new THREE.BufferAttribute(R.pos, 3), ca = new THREE.BufferAttribute(col, 3);
  const pc = R.pos.slice();
  for (let i = 0; i < n; i++) if (R.typ[i] === 0){ const o = i * 6; pc[o + 3] = pc[o]; pc[o + 4] = pc[o + 1]; pc[o + 5] = pc[o + 2]; }
  paAll = pa; paCut = new THREE.BufferAttribute(pc, 3);
  const g1 = new THREE.BufferGeometry(); g1.setAttribute('position', pa); g1.setAttribute('color', ca);
  const g2 = new THREE.BufferGeometry(); g2.setAttribute('position', pa); g2.setAttribute('color', ca);
  ghost = new THREE.LineSegments(g1, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.26, depthWrite:false}));
  traced = new THREE.LineSegments(g2, new THREE.LineBasicMaterial({vertexColors:true}));
  const g3 = new THREE.BufferGeometry(); g3.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  partial = new THREE.Line(g3, new THREE.LineBasicMaterial({color:C_FEED}));
  scene.add(ghost, traced, partial);
  applyPath();
  const b = R.bb;
  size = Math.max(b.max[0] - b.min[0], b.max[1] - b.min[1], b.max[2] - b.min[2], 1);
  buildGrid(); applyTheme();
}

let curTool = -1;
function setToolShape(t){
  curTool = t;
  const e = toolEff(t);
  let rad = e.d ? e.d / 2 : size * .012;
  rad = Math.max(rad, size * .004);
  const L = e.L || Math.max(rad * 3, size * .06);
  cutG.scale.set(rad, rad, L);
  holdG.scale.set(rad * 1.7, rad * 1.7, L * .8);
  holdG.position.z = L + L * .4;
}

let needs = false;
function requestRender(){ if (!needs){ needs = true; requestAnimationFrame(loop); } }
function resize(){
  const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); requestRender();
}
new ResizeObserver(resize).observe(viewerEl);

/* Gestos: 1 dedo gira, 2 dedos zoom y desplaza, doble toque ajusta. Ratón: rueda zoom, botón derecho o Shift desplaza. */
const ptrs = new Map(); let lastTap = 0, gest = null;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1){ const now = performance.now(); if (now - lastTap < 280) fit(); lastTap = now; }
  gest = null;
});
function panBy(dx, dy){
  const wpp = 2 * ctl.r * Math.tan(camera.fov * Math.PI / 360) / viewerEl.clientHeight;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  ctl.tgt.addScaledVector(right, -dx * wpp).addScaledVector(up, dy * wpp);
}
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (ptrs.size === 1){
    if (e.shiftKey || (e.buttons & 2) || (e.buttons & 4)) panBy(dx, dy);
    else { ctl.az -= dx * .008; ctl.el = Math.max(-1.55, Math.min(Math.PI / 2 - 1e-3, ctl.el + dy * .008)); document.querySelectorAll('.views button[data-v]').forEach(b => b.classList.remove('on')); }
    p.x = e.clientX; p.y = e.clientY;
  } else if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    const d0 = Math.hypot(a.x - b.x, a.y - b.y), m0 = {x:(a.x + b.x) / 2, y:(a.y + b.y) / 2};
    p.x = e.clientX; p.y = e.clientY;
    const d1 = Math.hypot(a.x - b.x, a.y - b.y), m1 = {x:(a.x + b.x) / 2, y:(a.y + b.y) / 2};
    if (d1 > 0 && d0 > 0) ctl.r *= d0 / d1;
    panBy(m1.x - m0.x, m1.y - m0.y);
  }
  applyCam(); requestRender();
});
const up = e => { ptrs.delete(e.pointerId); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); ctl.r *= Math.exp(e.deltaY * .0012); applyCam(); requestRender(); }, {passive:false});
document.querySelectorAll('.views button[data-v]').forEach(b => b.addEventListener('click', () => b.dataset.v === 'fit' ? fit() : setView(b.dataset.v)));

/* ============ Material (stock) y desbaste: mapa de alturas 2.5D ============ */
/* Rectangular: X/Y mín y máx. Redondo: cilindro de pie (eje en Z) con centro X/Y y diámetro. */
const STK = {on: LS.get('simg.stk') !== '0', res: +(LS.get('simg.stkres') || 260), src: '',
  shape: 'rect', x0: 0, x1: 100, y0: 0, y1: 80, ccx: 50, ccy: 40, dia: 80, z0: -20, z1: 0,
  nx: 0, ny: 0, cx: 1, cy: 1, h: null, crash: null, msk: null, done: 0, partI: -1, partF: 0, crashLine: -1,
  mesh: null, dirty: false, lastMesh: 0};
const stockMat = new THREE.MeshStandardMaterial({vertexColors: true, metalness: .25, roughness: .55, side: THREE.DoubleSide});
const dl2 = new THREE.DirectionalLight(0xffffff, .35); dl2.position.set(-2, 1.5, 1); scene.add(dl2);

function setShape(shape){
  if (shape === STK.shape) return;
  if (shape === 'round'){ STK.ccx = (STK.x0 + STK.x1) / 2; STK.ccy = (STK.y0 + STK.y1) / 2; STK.dia = Math.max(STK.x1 - STK.x0, STK.y1 - STK.y0); }
  else { const r = STK.dia / 2; STK.x0 = STK.ccx - r; STK.x1 = STK.ccx + r; STK.y0 = STK.ccy - r; STK.y1 = STK.ccy + r; }
  STK.shape = shape;
}
function stockAuto(){
  if (R.stockC){ Object.assign(STK, R.stockC); STK.src = 'comentario (STOCK …) del programa'; return; }
  const b = {x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity, z: Infinity};
  for (let i = 0; i < R.n; i++){
    if (R.typ[i] !== 1) continue;
    for (const o of [i * 6, i * 6 + 3]){
      if (R.pos[o + 2] >= -1e-6) continue;
      b.x0 = Math.min(b.x0, R.pos[o]); b.x1 = Math.max(b.x1, R.pos[o]);
      b.y0 = Math.min(b.y0, R.pos[o + 1]); b.y1 = Math.max(b.y1, R.pos[o + 1]); b.z = Math.min(b.z, R.pos[o + 2]);
    }
  }
  if (!isFinite(b.x0)){ const c = R.cb.min[0] <= R.cb.max[0] ? R.cb : R.bb; b.x0 = c.min[0]; b.x1 = c.max[0]; b.y0 = c.min[1]; b.y1 = c.max[1]; b.z = c.min[2] - 10; }
  if (b.x1 - b.x0 < 1){ b.x0 -= 5; b.x1 += 5; }
  if (b.y1 - b.y0 < 1){ b.y0 -= 5; b.y1 += 5; }
  Object.assign(STK, {x0: b.x0, x1: b.x1, y0: b.y0, y1: b.y1, z1: 0, z0: Math.min(b.z, 0) - 5,
    ccx: (b.x0 + b.x1) / 2, ccy: (b.y0 + b.y1) / 2, dia: Math.hypot(b.x1 - b.x0, b.y1 - b.y0)});
  STK.src = 'automático, ajústalo a tu material';
}
function stockInit(){
  if (STK.mesh){ scene.remove(STK.mesh); STK.mesh.geometry.dispose(); STK.mesh = null; }
  if (!STK.on || !R || !R.n) return;
  if (STK.shape === 'round'){ const r = STK.dia / 2; STK.x0 = STK.ccx - r; STK.x1 = STK.ccx + r; STK.y0 = STK.ccy - r; STK.y1 = STK.ccy + r; }
  const w = STK.x1 - STK.x0, l = STK.y1 - STK.y0;
  if (!(w > 0 && l > 0 && STK.z1 > STK.z0)){ toast('Las medidas del material no son válidas: revisa mínimos, máximos y alturas.', true); return; }
  const c = Math.max(w, l) / STK.res;
  STK.nx = Math.max(2, Math.round(w / c) + 1); STK.ny = Math.max(2, Math.round(l / c) + 1);
  STK.cx = w / (STK.nx - 1); STK.cy = l / (STK.ny - 1);
  const N = STK.nx * STK.ny;
  STK.h = new Float32Array(N).fill(STK.z1);
  STK.crash = new Uint8Array(N);
  STK.msk = null;
  if (STK.shape === 'round'){
    const r2 = (STK.dia / 2) ** 2 + 1e-9; STK.msk = new Uint8Array(N);
    for (let j = 0; j < STK.ny; j++) for (let i = 0; i < STK.nx; i++){
      const dx = STK.x0 + i * STK.cx - STK.ccx, dy = STK.y0 + j * STK.cy - STK.ccy;
      STK.msk[j * STK.nx + i] = dx * dx + dy * dy <= r2 ? 1 : 0;
    }
  }
  STK.done = 0; STK.partI = -1; STK.crashLine = -1; STK.holdLine = -1;
  buildStockMesh();
  if (grid) grid.position.z = STK.z0 - .01;
  if (ghost) ghost.material.opacity = .1;
}
function stockReset(){ STK.h.fill(STK.z1); STK.crash.fill(0); STK.done = 0; STK.partI = -1; STK.crashLine = -1; STK.holdLine = -1; }
/* Celda dentro del redondo más cercana a un punto (x, y). */
function nearestInside(x, y){
  const {nx, ny, msk} = STK;
  let i = Math.min(nx - 1, Math.max(0, Math.round((x - STK.x0) / STK.cx)));
  let j = Math.min(ny - 1, Math.max(0, Math.round((y - STK.y0) / STK.cy)));
  const ci = Math.round((STK.ccx - STK.x0) / STK.cx), cj = Math.round((STK.ccy - STK.y0) / STK.cy);
  for (let g = 0; g < nx + ny && !msk[j * nx + i]; g++){
    if (Math.abs(ci - i) >= Math.abs(cj - j)) i += Math.sign(ci - i); else j += Math.sign(cj - j);
  }
  return j * nx + i;
}

let TOV = {};
try { TOV = JSON.parse(LS.get('simg.tools') || '{}') || {}; } catch (e) { TOV = {}; }
/* Medidas que usa la simulación: primero las capturadas en Montaje, luego las del comentario del programa. */
function toolEff(t){
  const info = R.tools[t] || {}, o = TOV[t] || {}, d = info.desc || '';
  const kind = /BROCA|DRILL|CENTR|SPOT|AVELLAN/i.test(d) ? 'drill' : /BALL|BOLA|ESF[EÉ]RIC|BALLNOSE/i.test(d) ? 'ball' : 'flat';
  return {d: o.d ?? info.d ?? null, L: o.L ?? null, desc: d, kind};
}
const toolCache = {};
function toolOf(t){
  if (toolCache[t]) return toolCache[t];
  const e = toolEff(t);
  return (toolCache[t] = {r: e.d ? e.d / 2 : Math.max(size * .012, .5), kind: e.kind, L: e.L});
}
function stampLine(ax, ay, az, bx, by, bz, t, type, li){
  if (Math.min(az, bz) >= STK.z1 - 1e-9) return;
  const {r, kind, L} = toolOf(t), r2 = r * r;
  /* Con longitud capturada se revisa también un portaherramientas supuesto de radio 1.6 r (mínimo r + 5 mm). */
  const rh = L ? Math.max(r * 1.6, r + 5) : r, rh2 = rh * rh;
  const i0 = Math.max(0, Math.floor((Math.min(ax, bx) - rh - STK.x0) / STK.cx)), i1 = Math.min(STK.nx - 1, Math.ceil((Math.max(ax, bx) + rh - STK.x0) / STK.cx));
  const j0 = Math.max(0, Math.floor((Math.min(ay, by) - rh - STK.y0) / STK.cy)), j1 = Math.min(STK.ny - 1, Math.ceil((Math.max(ay, by) + rh - STK.y0) / STK.cy));
  if (i0 > i1 || j0 > j1) return;
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, h = STK.h, nx = STK.nx, zb = STK.z0, msk = STK.msk;
  for (let j = j0; j <= j1; j++){
    const py = STK.y0 + j * STK.cy;
    for (let i = i0; i <= i1; i++){
      const k = j * nx + i;
      if (msk && !msk[k]) continue;
      const px = STK.x0 + i * STK.cx;
      let u = L2 > 1e-12 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
      u = u < 0 ? 0 : u > 1 ? 1 : u;
      const ex = px - ax - u * dx, ey = py - ay - u * dy, d2 = ex * ex + ey * ey;
      if (d2 > rh2) continue;
      const zt = L2 > 1e-12 ? az + u * (bz - az) : (az < bz ? az : bz);
      if (L && h[k] > zt + L + .01){ STK.crash[k] = 1; if (STK.holdLine < 0){ STK.holdLine = li; STK.holdTool = t; } }
      if (d2 > r2) continue;
      let zc = zt;
      if (kind === 'ball') zc += r - Math.sqrt(r2 - d2); else if (kind === 'drill') zc += Math.sqrt(d2) * .6009;
      if (zc < zb) zc = zb;
      if (zc < h[k]){
        if (type === 0 && h[k] - zc > .01){ STK.crash[k] = 1; if (STK.crashLine < 0) STK.crashLine = li; }
        h[k] = zc;
      }
    }
  }
}
function stampSeg(s, x, y, z){
  const P = R.pos, o = s * 6;
  stampLine(P[o], P[o + 1], P[o + 2], x ?? P[o + 3], y ?? P[o + 4], z ?? P[o + 5], R.t[s], R.typ[s], R.lin[s]);
}
function stockAdvance(i, fr, x, y, z){
  if (!STK.mesh) return;
  if (STK.done > i || (STK.partI === i && fr < STK.partF - 1e-9)) stockReset();
  const hadCrash = STK.crashLine >= 0, hadHold = STK.holdLine >= 0;
  while (STK.done < i){ if (R.typ[STK.done] !== 2) stampSeg(STK.done); STK.done++; }
  if (R.typ[i] !== 2 && fr > 0) stampSeg(i, x, y, z);
  STK.partI = i; STK.partF = fr;
  STK.dirty = true;
  if (!hadCrash && STK.crashLine >= 0){
    const nm = R.lines[STK.crashLine].match(/^\s*N(\d+)/i);
    toast(`Rápido (G00) dentro del material en ${nm ? 'N' + nm[1] : 'la línea ' + (STK.crashLine + 1)}: posible choque. Se marca en rojo.`, true, null, 9000);
  } else if (!hadHold && STK.holdLine >= 0){
    const nm = R.lines[STK.holdLine].match(/^\s*N(\d+)/i);
    toast(`T${STK.holdTool}: la herramienta entra más que su longitud en ${nm ? 'N' + nm[1] : 'la línea ' + (STK.holdLine + 1)}. El portaherramientas tocaría el material.`, true, null, 9000);
  }
}

/* Malla: cara superior (rejilla), paredes (pares de vértices arriba/abajo) y fondo.
   topSrc y wallSrc dicen de qué celda toma su altura cada vértice. */
function buildStockMesh(){
  const {nx, ny} = STK, top = nx * ny, round = STK.shape === 'round';
  const topSrc = new Int32Array(top), wallSrc = [], wallXY = [], idx = [];
  const tx = new Float32Array(top), ty = new Float32Array(top);
  const r = STK.dia / 2;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){
    const k = j * nx + i; let x = STK.x0 + i * STK.cx, y = STK.y0 + j * STK.cy;
    topSrc[k] = k;
    if (round && !STK.msk[k]){
      const a = Math.atan2(y - STK.ccy, x - STK.ccx); x = STK.ccx + r * Math.cos(a); y = STK.ccy + r * Math.sin(a);
      topSrc[k] = nearestInside(x, y);
    }
    tx[k] = x; ty[k] = y;
  }
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++){
    const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1; idx.push(a, b, d, a, d, c);
  }
  const strips = [];
  if (round){
    const n = Math.max(72, Math.round(Math.PI * Math.max(nx, ny))), s = [];
    for (let m = 0; m <= n; m++){ const a = m / n * Math.PI * 2, x = STK.ccx + r * Math.cos(a), y = STK.ccy + r * Math.sin(a); s.push([x, y, nearestInside(x, y)]); }
    strips.push(s);
  } else {
    const eB = [], eT = [], eL = [], eR = [];
    for (let i = 0; i < nx; i++){ eB.push(i); eT.push((ny - 1) * nx + i); }
    for (let j = 0; j < ny; j++){ eL.push(j * nx); eR.push(j * nx + nx - 1); }
    for (const e of [eB, eT, eL, eR]) strips.push(e.map(k => [tx[k], ty[k], k]));
  }
  let wallN = 0; for (const s of strips) wallN += s.length * 2;
  const botN = round ? strips[0].length + 1 : 4;
  const nv = top + wallN + botN;
  const pos = new Float32Array(nv * 3), col = new Float32Array(nv * 3);
  for (let k = 0; k < top; k++){ pos[k * 3] = tx[k]; pos[k * 3 + 1] = ty[k]; }
  let v = top;
  for (const s of strips){
    const base = v;
    for (const [x, y, src] of s){
      wallSrc.push(src);
      pos[v * 3] = x; pos[v * 3 + 1] = y; v++;
      pos[v * 3] = x; pos[v * 3 + 1] = y; pos[v * 3 + 2] = STK.z0; v++;
    }
    for (let m = 0; m < s.length - 1; m++){ const a = base + m * 2; idx.push(a, a + 1, a + 3, a, a + 3, a + 2); }
  }
  const bz = v;
  if (round){
    pos[v * 3] = STK.ccx; pos[v * 3 + 1] = STK.ccy; pos[v * 3 + 2] = STK.z0; v++;
    for (const [x, y] of strips[0]){ pos[v * 3] = x; pos[v * 3 + 1] = y; pos[v * 3 + 2] = STK.z0; v++; }
    for (let m = 0; m < strips[0].length - 1; m++) idx.push(bz, bz + 1 + m, bz + 2 + m);
  } else {
    for (const [x, y] of [[STK.x0, STK.y0], [STK.x1, STK.y0], [STK.x1, STK.y1], [STK.x0, STK.y1]]){ pos[v * 3] = x; pos[v * 3 + 1] = y; pos[v * 3 + 2] = STK.z0; v++; }
    idx.push(bz, bz + 2, bz + 1, bz, bz + 3, bz + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(nv > 65535 ? new THREE.Uint32BufferAttribute(idx, 1) : new THREE.Uint16BufferAttribute(idx, 1));
  Object.assign(STK, {topSrc, wallSrc: Int32Array.from(wallSrc), wallStart: top, botStart: bz, botN});
  STK.mesh = new THREE.Mesh(g, stockMat);
  scene.add(STK.mesh);
  STK.dirty = true; updateStockMesh();
}
function updateStockMesh(){
  if (!STK.mesh || !STK.dirty) return;
  const g = STK.mesh.geometry, pos = g.attributes.position.array, col = g.attributes.color.array;
  const dark = css('--bg').toUpperCase() === '#000000';
  const cS = new THREE.Color(dark ? '#8E8783' : '#CFC9C5'), cC = new THREE.Color('#E3A47F'), cX = new THREE.Color('#D0402B');
  const {h, crash, z1, topSrc, wallSrc} = STK, top = topSrc.length;
  const paint = (v, c) => { col[v * 3] = c.r; col[v * 3 + 1] = c.g; col[v * 3 + 2] = c.b; };
  for (let k = 0; k < top; k++){
    const s = topSrc[k];
    pos[k * 3 + 2] = h[s];
    paint(k, crash[s] ? cX : h[s] < z1 - 1e-4 ? cC : cS);
  }
  let v = STK.wallStart;
  for (let m = 0; m < wallSrc.length; m++){ pos[v * 3 + 2] = h[wallSrc[m]]; paint(v, cS); paint(v + 1, cS); v += 2; }
  for (let q = 0; q < STK.botN; q++) paint(STK.botStart + q, cS);
  g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
  g.computeVertexNormals();
  STK.dirty = false; STK.lastMesh = performance.now();
}

let simT = 0, playing = false, lastTs = 0, speed = 10, curLine = -1;
const fmt = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
function segAt(t){
  const c = R.cum; let lo = 0, hi = R.n - 1;
  while (lo < hi){ const mid = (lo + hi) >> 1; if (c[mid] < t) lo = mid + 1; else hi = mid; }
  return lo;
}
function updateSim(){
  if (!R || !R.n){ toolG.visible = false; return; }
  toolG.visible = true;
  simT = Math.max(0, Math.min(simT, R.stats.total));
  const i = segAt(simT), t0 = i ? R.cum[i - 1] : 0, fr = Math.max(0, Math.min(1, (simT - t0) / R.dur[i]));
  const P = R.pos, o = i * 6;
  const x = P[o] + (P[o + 3] - P[o]) * fr, y = P[o + 1] + (P[o + 4] - P[o + 1]) * fr, z = P[o + 2] + (P[o + 5] - P[o + 2]) * fr;
  traced.geometry.setDrawRange(0, i * 2);
  const pp = partial.geometry.attributes.position.array;
  pp[0] = P[o]; pp[1] = P[o + 1]; pp[2] = P[o + 2]; pp[3] = x; pp[4] = y; pp[5] = z;
  partial.geometry.attributes.position.needsUpdate = true;
  partial.material.color = R.typ[i] === 0 ? C_RAPID : C_FEED;
  partial.visible = pathMode === 0 || (pathMode === 1 && R.typ[i] !== 0);
  toolG.position.set(x, y, z);
  if (STK.mesh){ stockAdvance(i, fr, x, y, z); if (!playing || performance.now() - STK.lastMesh > 70) updateStockMesh(); else requestRender(); }
  if (R.t[i] !== curTool) setToolShape(R.t[i]);
  $('#dx').textContent = len(x); $('#dy').textContent = len(y); $('#dz').textContent = len(z);
  $('#dt').textContent = R.t[i] ? 'T' + R.t[i] : '–';
  $('#ds').textContent = Math.round(R.s[i]);
  $('#df').textContent = R.typ[i] === 0 ? 'RÁP' : feed(R.f[i]);
  const nm = R.lines[R.lin[i]].match(/^\s*N(\d+)/i);
  $('#dn').textContent = nm ? 'N' + nm[1] : 'L' + (R.lin[i] + 1);
  $('#tNow').textContent = fmt(simT);
  if (!scrubbing) $('#scrub').value = R.stats.total ? Math.round(simT / R.stats.total * 1000) : 0;
  highlight(R.lin[i]);
}
function loop(ts){
  needs = false;
  if (playing){
    const dt = Math.min(.1, (ts - (lastTs || ts)) / 1000);
    simT += dt * speed;
    if (simT >= R.stats.total){ simT = R.stats.total; setPlaying(false); }
  }
  lastTs = ts;
  updateSim();
  renderer.render(scene, camera);
  if (playing) requestRender();
}
function setPlaying(p){
  if (!R || !R.n) p = false;
  if (p && simT >= R.stats.total - 1e-6) simT = 0;
  playing = p; lastTs = 0;
  $('#iPlay').innerHTML = p ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
  $('#bPlay').setAttribute('aria-label', p ? 'Pausa' : 'Reproducir');

$('#bPlay').onclick = () => setPlaying(!playing);
$('#bStart').onclick = () => { simT = 0; setPlaying(false); };
$('#bStep').onclick = () => {
  if (!R || !R.n) return; setPlaying(false);
  let i = segAt(simT + 1e-7); const L = R.lin[i];
  while (i < R.n && R.lin[i] === L) i++;
  simT = R.cum[i - 1]; requestRender();
};
$('#bBack').onclick = () => {
  if (!R || !R.n) return; setPlaying(false);
  let i = segAt(Math.max(0, simT - 1e-7)); const L = R.lin[i];
  while (i > 0 && R.lin[i - 1] === L) i--;
  const t = i ? R.cum[i - 1] : 0;
  if (t >= simT - 1e-7 && i > 0){ let j = i - 1; const L2 = R.lin[j]; while (j > 0 && R.lin[j - 1] === L2) j--; simT = j ? R.cum[j - 1] : 0; }
  else simT = t;
  requestRender();
};

  $('#sres').onchange = applyStk;
  document.querySelectorAll('.seg button[data-f]').forEach(b => b.onclick = () => { setShape(b.dataset.f); STK.src = 'capturadas a mano'; setStock(true); showPane('setup'); });
  $('#sAuto').onclick = () => { R.stockC = null; stockAuto(); setStock(true); showPane('setup'); };
  document.querySelectorAll('.seg button[data-d]').forEach(b => b.onclick = () => {
    const inch = b.dataset.d === 'in'; if (inch === defInch) return;
    defInch = inch; LS.set('simg.defunit', inch ? 'in' : 'mm');
    load(program, nameNow); showPane('setup');
    toast(R.unitsGuessed ? `Programa leído en ${inch ? 'pulgadas' : 'milímetros'}.` : 'Guardado. Este programa trae G20/G21, así que no cambia.');
  });
  document.querySelectorAll('.tin').forEach(inp => inp.onchange = () => {
    const t = +inp.dataset.t, k = inp.dataset.k, v = parseFloat(inp.value);
    const o = TOV[t] || (TOV[t] = {});
    if (inp.value === '' ) delete o[k];
    else if (!(v > 0)){ toast('La medida debe ser mayor que cero.', true); renderSetup(); return; }
    else o[k] = dispInch ? v * 25.4 : v;
    if (!Object.keys(o).length) delete TOV[t];
    saveTools(); toast(`T${t}: ${k === 'd' ? 'diámetro actualizado' : 'longitud actualizada'}.`);
  });
  $('#tClear').onclick = () => { for (const t of toolRows()) delete TOV[t]; saveTools(); toast('Se usan las medidas del programa.'); };
}
function saveTools(){
  LS.set('simg.tools', JSON.stringify(TOV));
  for (const k in toolCache) delete toolCache[k];
  curTool = -1;
  if (STK.mesh) stockInit();
  renderInfo(); renderSetup(); requestRender();
}
function setUnits(inch){
  dispInch = inch;
  $('#bUnit').textContent = UN().toUpperCase();
  $('#bUnit').setAttribute('aria-label', 'Unidades: ' + (inch ? 'pulgadas' : 'milímetros') + '. Toca para cambiar');
  if (R){ buildGrid(); renderInfo(); renderSetup(); }
  requestRender();
}
$('#bUnit').onclick = () => setUnits(!dispInch);
$('#bPath').onclick = () => { pathMode = (pathMode + 1) % 3; LS.set('simg.path', pathMode); applyPath(); toast(PATH_TXT[pathMode] + '.'); };
$('#bStock').onclick = () => { setStock(!STK.on); if (STK.on && STK.src.startsWith('automático')) toast('Captura las medidas reales del material en la pestaña Montaje.'); };
function renderWarns(){
  const c = R.W.length;
  $('#wcount').hidden = !c; $('#wcount').textContent = c;
  $('#warns').innerHTML = c ? R.W.map(w => `<li><button type="button" data-l="${w.li}">L${w.li + 1}</button><span>${esc(w.msg)}</span></li>`).join('')
    : '<li class="ok">Sin avisos. Revisa de todas formas alturas, herramientas y orígenes en la máquina.</li>';
}
$('#warns').addEventListener('click', e => { const b = e.target.closest('button[data-l]'); if (b){ showPane('code'); userScrollAt = 0; jumpToLine(+b.dataset.l); } });

/* ============ Carga ============ */
let defInch = LS.get('simg.defunit') === 'in';
let program = '', nameNow = '', rapidMM = parseFloat(LS.get('simg.rapid')) || 10000;
function load(src, name, keepTime){
  program = src; nameNow = name;
  $('#fname').textContent = name;
  setPlaying(false);
  const prevT = simT;
  R = parse(src, rapidMM, defInch);
  if (!keepTime) dispInch = R.inch;
  buildScene();
  for (const k in toolCache) delete toolCache[k];
  if (!keepTime) stockAuto();
  STK.on ? setStock(true) : null;
  $('#bStock').classList.toggle('on', STK.on);
  renderCode(); setUnits(dispInch); renderWarns();
  curTool = -1;
  simT = keepTime ? prevT : (R.n ? R.stats.total : 0);
  $('#tTot').textContent = fmt(R.stats.total);
  if (!keepTime) setView('iso');
  LS.set('simg.prog', src); LS.set('simg.name', name);
  requestRender();
}
let toastT = 0;
function toast(msg, err, link, ms){
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.hidden = false;
  if (link){ const a = document.createElement('a'); a.href = link.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = link.text; t.append(document.createElement('br'), a); }
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms || (err ? 7000 : 3500));
}
/* Algunas vistas web (por ejemplo la app de Claude en Android) no abren el selector de archivos.
   Si al tocar Abrir la página no pierde el foco en 1.5 s, el selector no se abrió: se ofrece Pegar o el navegador. */
const PAGE_URL = 'https://claude.ai/artifact/UG1wkxxU5zHncHwXRY6mrb';
let pickAt = 0;
const pickOpened = () => { pickAt = 0; };
window.addEventListener('blur', pickOpened);
document.addEventListener('visibilitychange', pickOpened);
$('#file').addEventListener('click', () => {
  pickAt = performance.now();
  setTimeout(() => {
    if (!pickAt || document.hidden) return;
    pickAt = 0;
    toast('Esta app no deja abrir archivos desde aquí. Usa Pegar, o abre el simulador en Chrome, donde Abrir sí funciona.', true,
      window.self !== window.top ? {href: PAGE_URL, text: 'Abrir en Chrome'} : null, 12000);
  }, 1500);
});
function readFile(f){
  if (f.text) return f.text();
  return new Promise((ok, bad) => { const rd = new FileReader(); rd.onload = () => ok(String(rd.result)); rd.onerror = () => bad(rd.error); rd.readAsText(f); });
}
function loadChecked(txt, name){
  if (!txt.trim()){ toast('Está vacío: no hay código que simular.', true); return; }
  if ((txt.slice(0, 4000).match(/\0/g) || []).length > 4){ toast('Ese archivo no es texto (parece binario). Exporta el programa como .nc o .txt.', true); return; }
  load(txt, name); simT = 0; showPane('code'); requestRender();
  if (!R.n) toast('No encontré movimientos G0/G1/G2/G3 en ' + name + '. Revisa en Avisos qué se leyó.', true);
  else if (R.unitsGuessed) toast(`${name} no dice G20 ni G21: lo leí en ${R.inch ? 'pulgadas' : 'milímetros'}. Si no es así, cámbialo en Montaje.`, true, null, 9000);
  else toast(`${name}: ${R.lines.length} bloques en ${R.mixed ? 'mm y pulgadas' : R.inch ? 'pulgadas (G20)' : 'mm (G21)'}, ${R.W.length ? R.W.length + ' avisos' : 'sin avisos'}. Toca ▶ para simular.`);
}
$('#file').addEventListener('change', async e => {
  pickAt = 0;
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f){ toast('No se eligió ningún archivo.', true); return; }
  toast('Leyendo ' + f.name + '…');
  try { loadChecked(await readFile(f), f.name); }
  catch (err){ toast('No se pudo leer el archivo (' + (err && err.message || 'error del teléfono') + '). Usa Pegar.', true); }
});
$('#paste').onclick = () => {
  $('#ed').value = ''; $('#ed').placeholder = 'Mantén presionado aquí y elige Pegar.\nLuego toca Simular.';
  showPane('edit'); $('#ed').focus();
};
$('#sample').onclick = () => { load(SAMPLE, 'Ejemplo: placa demo'); };

new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

const saved = LS.get('simg.prog');
load(saved || SAMPLE, saved ? (LS.get('simg.name') || 'Programa guardado') : 'Ejemplo: placa demo');
resize(); fit();
</script>
