<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Finanzas</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --income: #16a34a;
    --expense: #dc2626;
    --income-bg: #f0fdf4;
    --expense-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1e2128;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #30343c;
      --accent: #3b82f6;
      --income: #4ade80;
      --expense: #f87171;
      --income-bg: #0f2417;
      --expense-bg: #2a1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-muted);
    margin: 0 0 20px;
    font-size: 0.9rem;
  }
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .stat .value {
    font-size: 1.4rem;
    font-weight: 600;
    margin-top: 4px;
  }
  .stat.income .value { color: var(--income); }
  .stat.expense .value { color: var(--expense); }

  form {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  form .full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  button {
    grid-column: 1 / -1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }

  .table-wrap {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.75rem;
    text-transform: uppercase;
  }
  tr:last-child td { border-bottom: none; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
  .amount.income { color: var(--income); }
  .amount.expense { color: var(--expense); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge.income { background: var(--income-bg); color: var(--income); }
  .badge.expense { background: var(--expense-bg); color: var(--expense); }
  .del-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 6px;
    grid-column: auto;
  }
  .del-btn:hover { color: var(--expense); }
  .empty {
    padding: 32px;
    text-align: center;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mis Finanzas</h1>
  <p class="subtitle">Registra tus ingresos y gastos. Los datos se guardan en este navegador.</p>

  <div class="summary">
    <div class="stat income">
      <div class="label">Ingresos</div>
      <div class="value" id="totalIncome">$0.00</div>
    </div>
    <div class="stat expense">
      <div class="label">Gastos</div>
      <div class="value" id="totalExpense">$0.00</div>
    </div>
    <div class="stat">
      <div class="label">Balance</div>
      <div class="value" id="balance">$0.00</div>
    </div>
  </div>

  <form id="entryForm">
    <div class="full">
      <label for="desc">Descripción</label>
      <input type="text" id="desc" placeholder="Ej. Salario, Renta, Comida" required>
    </div>
    <div>
      <label for="amount">Monto</label>
      <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
    </div>
    <div>
      <label for="type">Tipo</label>
      <select id="type">
        <option value="income">Ingreso</option>
        <option value="expense">Gasto</option>
      </select>
    </div>
    <div>
      <label for="category">Categoría</label>
      <input type="text" id="category" placeholder="Ej. Hogar, Transporte">
    </div>
    <div>
      <label for="date">Fecha</label>
      <input type="date" id="date">
    </div>
    <button type="submit">Agregar movimiento</button>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Descripción</th>
          <th>Categoría</th>
          <th>Tipo</th>
          <th>Monto</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" hidden>Aún no hay movimientos. Agrega el primero arriba.</div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'sam-finance-entries';
  let entries = [];

  try {
    entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    entries = [];
  }

  const form = document.getElementById('entryForm');
  const tableBody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const dateInput = document.getElementById('date');
  dateInput.value = new Date().toISOString().slice(0, 10);

  const fmt = (n) => '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) {}
  }

  function render() {
    tableBody.innerHTML = '';
    const sorted = [...entries].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    if (sorted.length === 0) {
      emptyState.hidden = false;
    } else {
      emptyState.hidden = true;
      for (const e of sorted) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${e.date || '-'}</td>
          <td>${escapeHtml(e.desc)}</td>
          <td>${escapeHtml(e.category || '-')}</td>
          <td><span class="badge ${e.type}">${e.type === 'income' ? 'Ingreso' : 'Gasto'}</span></td>
          <td class="amount ${e.type}">${e.type === 'income' ? '+' : '-'}${fmt(e.amount)}</td>
          <td><button class="del-btn" data-id="${e.id}" title="Eliminar">✕</button></td>
        `;
        tableBody.appendChild(tr);
      }
    }

    const totalIncome = entries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
    const totalExpense = entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
    document.getElementById('totalIncome').textContent = fmt(totalIncome);
    document.getElementById('totalExpense').textContent = fmt(totalExpense);
    document.getElementById('balance').textContent = fmt(totalIncome - totalExpense);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const desc = document.getElementById('desc').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const type = document.getElementById('type').value;
    const category = document.getElementById('category').value.trim();
    const date = dateInput.value;

    if (!desc || isNaN(amount) || amount <= 0) return;

    entries.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      desc, amount, type, category, date
    });
    save();
    render();
    form.reset();
    dateInput.value = new Date().toISOString().slice(0, 10);
    document.getElementById('desc').focus();
  });

  tableBody.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.del-btn');
    if (!btn) return;
    entries = entries.filter(e => e.id !== btn.dataset.id);
    save();
    render();
  });

  render();
</script>
</body>
</html>
